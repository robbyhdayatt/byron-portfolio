<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Sky Blue to Deep Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    
    <!-- Letter B Accent Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>

    <!-- Sun Gold Glow Accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Top-Right Ambient Sun Dot -->
  <circle cx="50" cy="14" r="5" fill="url(#glowGrad)"/>

  <!-- Bold & Sleek Letter 'B' with Modern Aerodynamic Cut -->
  <path d="M20 14H34C39.5228 14 44 17.5817 44 22C44 25.184 41.8763 27.9158 38.8044 29.208C42.8711 30.4137 45.5 33.7229 45.5 37.8C45.5 43.1019 40.5751 47.5 34.5 47.5H20V14Z" 
        fill="url(#letterGrad)"/>

  <!-- Top Inner Cutout -->
  <path d="M28 20.5V26.5H33.5C35.433 26.5 37 25.1569 37 23.5C37 21.8431 35.433 20.5 33.5 20.5H28Z" 
        fill="#1565C0"/>

  <!-- Bottom Inner Cutout -->
  <path d="M28 33.5V41H34.5C36.7091 41 38.5 39.3208 38.5 37.25C38.5 35.1792 36.7091 33.5 34.5 33.5H28Z" 
        fill="#1565C0"/>
</svg>
