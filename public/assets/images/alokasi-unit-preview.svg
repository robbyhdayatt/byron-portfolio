<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgAL)"/>
  <!-- Top Nav Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <circle cx="30" cy="25" r="6" fill="#EF4444"/>
  <circle cx="50" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="25" r="6" fill="#10B981"/>
  <text x="110" y="30" fill="#9CA3AF" font-family="monospace" font-size="13" font-weight="bold">ALOKASI UNIT PLN // WAREHOUSE & DEALER DISTRIBUTION</text>
  <rect x="660" y="14" width="110" height="24" rx="12" fill="#4338CA"/>
  <text x="678" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">SYNC VIEW</text>

  <!-- Warehouse Cards -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="350" height="100" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="24" y="35" fill="#9CA3AF" font-family="sans-serif" font-size="13">Main Warehouse Stock (PLN)</text>
    <text x="24" y="75" fill="#818CF8" font-family="sans-serif" font-size="32" font-weight="bold">1,240 Unit</text>
    <text x="240" y="75" fill="#10B981" font-family="sans-serif" font-size="13">Ready Allocate</text>

    <rect x="385" y="0" width="350" height="100" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="409" y="35" fill="#9CA3AF" font-family="sans-serif" font-size="13">Allocated to 34+ Dealers</text>
    <text x="409" y="75" fill="#34D399" font-family="sans-serif" font-size="32" font-weight="bold">895 Unit</text>
    <text x="620" y="75" fill="#F59E0B" font-family="sans-serif" font-size="13">In-Transit</text>
  </g>

  <!-- Distribution Table -->
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="735" height="220" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="25" y="35" fill="#F9FAFB" font-family="sans-serif" font-size="14" font-weight="bold">Live Vehicle Allocation & Invoicing Status</text>

    <rect x="25" y="55" width="685" height="32" rx="6" fill="#111827"/>
    <text x="45" y="76" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="bold">NO. RANGKA / ENGINE</text>
    <text x="230" y="76" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="bold">MODEL & WARNA</text>
    <text x="400" y="76" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="bold">DESTINATION DEALER</text>
    <text x="560" y="76" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="bold">STU STATUS</text>

    <!-- Row 1 -->
    <rect x="25" y="95" width="685" height="36" rx="6" fill="#162235"/>
    <text x="45" y="118" fill="#F9FAFB" font-family="monospace" font-size="12">MH3SG5620PK0912</text>
    <text x="230" y="118" fill="#818CF8" font-family="sans-serif" font-size="12">NMAX Neo (Hitam)</text>
    <text x="400" y="118" fill="#E5E7EB" font-family="sans-serif" font-size="12">Lautan Teduh Kedaton</text>
    <text x="560" y="118" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">STU TERBIT</text>

    <!-- Row 2 -->
    <rect x="25" y="138" width="685" height="36" rx="6" fill="#162235"/>
    <text x="45" y="161" fill="#F9FAFB" font-family="monospace" font-size="12">MH3SG5620PK0935</text>
    <text x="230" y="161" fill="#818CF8" font-family="sans-serif" font-size="12">Fazzio Hybrid (Cyan)</text>
    <text x="400" y="161" fill="#E5E7EB" font-family="sans-serif" font-size="12">Lautan Teduh Metro</text>
    <text x="560" y="161" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="bold">DO DITERIMA</text>

    <!-- Row 3 -->
    <rect x="25" y="181" width="685" height="36" rx="6" fill="#162235"/>
    <text x="45" y="204" fill="#F9FAFB" font-family="monospace" font-size="12">MH3SG5620PK0988</text>
    <text x="230" y="204" fill="#818CF8" font-family="sans-serif" font-size="12">XMAX Connected (Red)</text>
    <text x="400" y="204" fill="#E5E7EB" font-family="sans-serif" font-size="12">Lautan Teduh Sentral</text>
    <text x="560" y="204" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">STU TERBIT</text>
